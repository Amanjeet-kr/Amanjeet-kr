
<svg xmlns="http://www.w3.org/2000/svg"
     width="880" height="200" viewBox="0 0 880 200">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#020817"/>
      <stop offset=".55" stop-color="#071a38"/>
      <stop offset="1" stop-color="#020817"/>
    </linearGradient>

    <linearGradient id="packet" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Network paths -->
    <path id="route1" d="M635 88 L704 52 L779 75"/>
    <path id="route2" d="M635 88 L710 105 L794 105"/>
    <path id="route3" d="M635 88 L699 153 L778 135"/>
  </defs>

  <!-- Background -->
  <rect width="880" height="200" fill="url(#bg)"/>
  <rect x=".5" y=".5" width="879" height="199"
        fill="none" stroke="#123052"/>

  <!-- Background stars -->
  <g fill="#dbeafe">
    <circle cx="40" cy="45" r="1"/>
    <circle cx="100" cy="24" r=".8"/>
    <circle cx="180" cy="60" r="1"/>
    <circle cx="270" cy="25" r=".8"/>
    <circle cx="350" cy="55" r="1"/>
    <circle cx="440" cy="23" r=".8"/>
    <circle cx="525" cy="43" r="1"/>
    <circle cx="590" cy="28" r=".8"/>
    <circle cx="845" cy="35" r="1"/>
    <circle cx="850" cy="165" r=".8"/>
    <circle cx="530" cy="170" r=".8"/>
    <circle cx="390" cy="145" r=".7"/>
    <circle cx="48" cy="140" r=".8"/>
  </g>

  <!-- Twinkling stars -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle cx="120" cy="95" r="1.4">
      <animate attributeName="opacity"
        values=".2;1;.2" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="450" cy="65" r="1.3">
      <animate attributeName="opacity"
        values="1;.2;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="560" cy="145" r="1.2">
      <animate attributeName="opacity"
        values=".15;1;.15" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Shooting star 1 -->
  <g filter="url(#glow)">
    <path d="M-35 0 H0" stroke="url(#packet)" stroke-width="1.5">
      <animateMotion path="M420,-10 L550,65"
        dur="4s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0;1;1;0" keyTimes="0;.15;.75;1"
        dur="4s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Shooting star 2 -->
  <g filter="url(#glow)">
    <path d="M-30 0 H0" stroke="url(#packet)" stroke-width="1.2">
      <animateMotion path="M170,-10 L255,45"
        begin="2s" dur="4.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0;1;1;0" keyTimes="0;.15;.75;1"
        begin="2s" dur="4.5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Shooting star 3 -->
  <g filter="url(#glow)">
    <path d="M-28 0 H0" stroke="url(#packet)" stroke-width="1.1">
      <animateMotion path="M520,-10 L600,42"
        begin="3s" dur="5s" repeatCount="indefinite"/>
      <animate attributeName="opacity"
        values="0;1;1;0" keyTimes="0;.15;.75;1"
        begin="3s" dur="5s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- Network connections -->
  <g fill="none" stroke="#164e80" stroke-width="1">
    <use href="#route1"/>
    <use href="#route2"/>
    <use href="#route3"/>
    <path d="M779 75 L794 105 L778 135"/>
  </g>

  <!-- Dispatcher -->
  <rect x="612" y="76" width="46" height="24" rx="4"
        fill="#071a30" stroke="#38bdf8" stroke-width="1.2"/>
  <text x="635" y="91" fill="#7dd3fc"
        font-family="monospace" font-size="9"
        text-anchor="middle">API</text>

  <!-- Worker nodes -->
  <g fill="#071a30" stroke="#38bdf8" stroke-width="1.3">
    <circle cx="704" cy="52" r="5"/>
    <circle cx="779" cy="75" r="5"/>
    <circle cx="794" cy="105" r="5"/>
    <circle cx="778" cy="135" r="5"/>
    <circle cx="699" cy="153" r="5"/>
  </g>

  <!-- Pulsing network node -->
  <circle cx="794" cy="105" r="7" fill="none"
          stroke="#38bdf8" stroke-width="1">
    <animate attributeName="r"
      values="6;12;6" dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="opacity"
      values=".8;0;.8" dur="2.4s" repeatCount="indefinite"/>
  </circle>

  <!-- Moving data packets: outgoing -->
  <g fill="#38bdf8" filter="url(#glow)">
    <circle r="2.4">
      <animateMotion dur="2.5s" repeatCount="indefinite">
        <mpath href="#route1"/>
      </animateMotion>
    </circle>
    <circle r="2.4">
      <animateMotion dur="2.5s" begin=".8s"
                     repeatCount="indefinite">
        <mpath href="#route2"/>
      </animateMotion>
    </circle>
    <circle r="2.4">
      <animateMotion dur="2.5s" begin="1.6s"
                     repeatCount="indefinite">
        <mpath href="#route3"/>
      </animateMotion>
    </circle>
  </g>

  <!-- Returning data packets -->
  <g fill="#7dd3fc" filter="url(#glow)">
    <circle r="2">
      <animateMotion dur="2.8s" begin=".5s"
        repeatCount="indefinite"
        path="M794,105 L710,105 L635,88"/>
    </circle>
    <circle r="2">
      <animateMotion dur="2.8s" begin="1.5s"
        repeatCount="indefinite"
        path="M778,135 L699,153 L635,88"/>
    </circle>
  </g>

  <!-- Header -->
  <text x="24" y="25" fill="#38bdf8"
        font-family="monospace" font-size="10">&gt; main</text>
  <text x="856" y="25" fill="#7dd3fc"
        font-family="monospace" font-size="10"
        text-anchor="end">CODE · BUILD · GROW</text>
  <path d="M24 34 H856" stroke="#153451" stroke-width=".7"/>

  <!-- Name -->
  <text x="28" y="82" fill="#f0f6fc"
        font-family="Arial, Helvetica, sans-serif"
        font-size="31" font-weight="700">Amanjeet</text>
  <text x="191" y="82" fill="#38bdf8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="31" font-weight="700">Kumar</text>

  <!-- Tagline -->
  <text x="29" y="111" fill="#c9dff5"
        font-family="monospace" font-size="12">Full-Stack Developer in Progress</text>

  <!-- Blinking cursor -->
  <rect x="275" y="99" width="6" height="15" rx="1"
        fill="#38bdf8">
    <animate attributeName="opacity"
      values="1;1;0;0" keyTimes="0;.48;.5;1"
      dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- Technology stack: all listed separately -->
  <text x="28" y="149"
        font-family="monospace"
        font-size="10.5"
        fill="#7d8590">MongoDB · Express.js · React · Node.js · Docker · India</text>

  <!-- Bottom accent -->
  <path d="M24 177 H856" stroke="#164e80" stroke-width=".8"/>
  <path d="M24 177 H290" stroke="#38bdf8" stroke-width="1.3">
    <animate attributeName="opacity"
      values=".25;.8;.25" dur="4s" repeatCount="indefinite"/>
  </path>

</svg>
